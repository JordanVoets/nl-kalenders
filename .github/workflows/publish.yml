name: Publish calendars

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"   # every Monday 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write   # commit refreshed school-vacation cache / keepalive
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate .ics feeds
        run: python3 generate.py --out public

      # Commit the refreshed Rijksoverheid cache when it changed. If nothing was
      # committed for ~50 days, push an empty commit so GitHub doesn't disable
      # this scheduled workflow (it does that after 60 days without activity).
      - name: Commit cache / keepalive
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/; then
            git add data/
            git commit -m "Update school vacation cache from Rijksoverheid"
            git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 50 * 86400 )) ]; then
            git commit --allow-empty -m "Keepalive for scheduled workflow"
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
