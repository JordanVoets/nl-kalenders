name: Publish calendars

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 1 * *"   # 1st of every month, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit the refreshed school-vacation cache
      pages: write
    steps:
      - uses: actions/checkout@v7

      - name: Generate .ics feeds
        run: python3 generate.py --out public

      - name: Commit school-vacation cache if it changed
        run: |
          if ! git diff --quiet -- data/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Update school vacation cache from Rijksoverheid"
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # GitHub disables scheduled workflows in public repos after 60 days without
  # activity. Calling the "enable workflow" API on an already-enabled workflow
  # resets that counter, so no keepalive commits are needed.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Reset the 60-day inactivity timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publish.yml/enable"
